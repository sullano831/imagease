<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12705F"/>
      <stop offset="100%" stop-color="#0B4A3E"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BFE9DD"/>
      <stop offset="100%" stop-color="#9CDCCB"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- soft inner glow -->
  <circle cx="120" cy="120" r="95" fill="#ffffff" opacity="0.04"/>

  <!-- back photo card (left, tilted) -->
  <g transform="translate(78,132) rotate(-16)">
    <rect x="-38" y="-46" width="76" height="92" rx="14" fill="#EAF7F2" opacity="0.55"/>
  </g>

  <!-- back photo card (right, tilted) -->
  <g transform="translate(162,132) rotate(14)">
    <rect x="-38" y="-46" width="76" height="92" rx="14" fill="#EAF7F2" opacity="0.75"/>
  </g>

  <!-- front photo card -->
  <g transform="translate(120,130) rotate(-3)">
    <rect x="-46" y="-56" width="92" height="112" rx="16" fill="#FFFFFF"/>
    <!-- cute face -->
    <circle cx="-16" cy="-6" r="7" fill="#0B4A3E"/>
    <circle cx="16" cy="-6" r="7" fill="#0B4A3E"/>
    <circle cx="-13.5" cy="-8.5" r="2.1" fill="#ffffff"/>
    <circle cx="18.5" cy="-8.5" r="2.1" fill="#ffffff"/>
    <path d="M -18 16 Q 0 34 18 16" stroke="#0B4A3E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="-28" cy="10" r="5" fill="#FFB4A0" opacity="0.7"/>
    <circle cx="28" cy="10" r="5" fill="#FFB4A0" opacity="0.7"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFD866">
    <path d="M 186 62 L 190 74 L 202 78 L 190 82 L 186 94 L 182 82 L 170 78 L 182 74 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <path d="M 54 82 L 57 90 L 65 93 L 57 96 L 54 104 L 51 96 L 43 93 L 51 90 Z"/>
  </g>
  <circle cx="196" cy="150" r="5" fill="#FF9E7D"/>
</svg>
